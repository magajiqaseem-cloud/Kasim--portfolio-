<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="robots" content="noindex">
<title>Turntable renderer (internal tool)</title>
<style>html,body{margin:0;background:#06070a}canvas{display:block}</style></head>
<body>
<!-- Internal tool: renders a GLB as an evenly spaced turntable image sequence, so the same
     subject can be shown as a light image-sequence 360° on phones. A headless browser waits
     for window.frame, then calls window.frame(i) for each step and saves the data URLs. -->
<script type="module">
import * as THREE from './vendor/three.module.min.js';
import { GLTFLoader } from './vendor/GLTFLoader.js';
import { RoomEnvironment } from './vendor/RoomEnvironment.js';
const q=new URLSearchParams(location.search), N=+q.get('n')||36, W=+q.get('w')||1600, H=+q.get('h')||900, front=+q.get('front')||30;
const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
r.setSize(W,H);r.toneMapping=THREE.ACESFilmicToneMapping;r.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(r.domElement);
const scene=new THREE.Scene(), pm=new THREE.PMREMGenerator(r);scene.environment=pm.fromScene(new RoomEnvironment(),.04).texture;
const key=new THREE.DirectionalLight(0xfff1d6,1.6);key.position.set(4,6,3);scene.add(key);scene.add(new THREE.HemisphereLight(0x9fb4ff,0x15110a,.5));
const cam=new THREE.PerspectiveCamera(32,W/H,.05,500);
new GLTFLoader().load(q.get('model'),g=>{
  const root=g.scene;scene.add(root);
  const b=new THREE.Box3().setFromObject(root),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());
  root.position.sub(new THREE.Vector3(c.x,b.min.y,c.z));
  const rad=Math.max(s.x,s.z)*.5,t=Math.tan(THREE.MathUtils.degToRad(16)),d=Math.max(s.y/(1.35*t),2*rad/(1.25*t*W/H))+rad*.6;
  window.frame=i=>{const a=THREE.MathUtils.degToRad(front+i*360/N);cam.position.set(Math.sin(a)*d,s.y*.55+d*.18,Math.cos(a)*d);cam.lookAt(0,s.y*.46,0);r.render(scene,cam);return r.domElement.toDataURL('image/webp',.86)};
},undefined,e=>{console.error('load failed',e&&e.message||e)});
</script></body></html>
