:root{--gold:#c9a84c;--gold-light:#e8cc7a;--gold-dark:#8a6a1f;--black:#050505;--dark:#0d0d0d;--dark2:#141414;--white:#f5f0e8;--muted:#888;--border:rgba(201,168,76,0.18);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--black);color:var(--white);font-family:'Outfit',sans-serif;font-weight:300;overflow-x:hidden;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--black);}::-webkit-scrollbar-thumb{background:var(--gold-dark);}
nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:1rem 4rem;background:rgba(5,5,5,0.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);}
.nav-logo img{height:48px;width:auto;display:block;object-fit:contain;}
.nav-links{display:flex;gap:2.5rem;list-style:none;}
.nav-links a{color:var(--muted);text-decoration:none;font-size:0.8rem;letter-spacing:0.12em;text-transform:uppercase;transition:color 0.3s;position:relative;padding-bottom:2px;}
.nav-links a::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform 0.3s;}
.nav-links a:hover,.nav-links a.active{color:var(--gold);}
.nav-links a:hover::after,.nav-links a.active::after{transform:scaleX(1);}
.nav-cta{background:transparent;border:1px solid var(--gold);color:var(--gold);padding:0.55rem 1.4rem;font-family:'Outfit',sans-serif;font-size:0.78rem;letter-spacing:0.12em;text-transform:uppercase;text-decoration:none;transition:background 0.3s,color 0.3s;}
.nav-cta:hover{background:var(--gold);color:var(--black);}
.nav-toggle{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px;}
.nav-toggle span{display:block;width:24px;height:1.5px;background:var(--gold);}
.mobile-menu{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(5,5,5,0.98);z-index:190;flex-direction:column;align-items:center;justify-content:center;gap:2.5rem;}
.mobile-menu.open{display:flex;}
.mobile-menu a{font-family:'Cormorant Garamond',serif;font-size:2.5rem;font-weight:300;color:var(--muted);text-decoration:none;transition:color 0.3s;}
.mobile-menu a:hover{color:var(--gold);}
.mobile-close{position:absolute;top:1.5rem;right:1.5rem;font-size:1.5rem;color:var(--gold);cursor:pointer;background:none;border:none;}

/* HERO */
.hero{min-height:55vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10rem 2rem 5rem;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 40%,rgba(201,168,76,0.08) 0%,transparent 70%);}
.hero-grid{position:absolute;inset:0;opacity:0.015;background-image:linear-gradient(var(--gold) 1px,transparent 1px),linear-gradient(90deg,var(--gold) 1px,transparent 1px);background-size:60px 60px;}
.hero-label{font-size:0.7rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold);margin-bottom:1.2rem;display:flex;align-items:center;gap:0.8rem;position:relative;animation:fadeUp 0.8s ease 0.1s both;}
.hero-label::before,.hero-label::after{content:'';display:block;width:40px;height:1px;background:var(--gold);}
.hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(3rem,7vw,6.5rem);font-weight:300;line-height:1.05;color:var(--white);margin-bottom:1rem;position:relative;animation:fadeUp 0.8s ease 0.25s both;}
.hero h1 em{font-style:italic;color:var(--gold);}
.hero p{max-width:580px;font-size:1rem;line-height:1.8;color:var(--muted);position:relative;animation:fadeUp 0.8s ease 0.4s both;}

/* STATS BAR */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);background:var(--dark2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
.stat-item{padding:2.5rem 2rem;text-align:center;border-right:1px solid var(--border);}
.stat-item:last-child{border-right:none;}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:3rem;font-weight:300;color:var(--gold);line-height:1;margin-bottom:0.4rem;}
.stat-label{font-size:0.68rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);}

/* FILTER */
.filter-bar{display:flex;justify-content:center;gap:0.6rem;padding:4rem 4rem 2rem;flex-wrap:wrap;}
.filter-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:0.55rem 1.5rem;font-family:'Outfit',sans-serif;font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;transition:all 0.3s;}
.filter-btn:hover,.filter-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,0.06);}
