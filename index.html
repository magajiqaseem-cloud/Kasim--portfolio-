<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Kasim Magaji | Kasim Elite Digital Global — Premium web development, AI automation, branding, SEO and digital marketing for global businesses. Nigeria-based digital agency."/>
<title>Kasim Magaji | Kasim Elite Digital Global</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --black: #0b0b0b;
  --white: #ffffff;
  --gold: #D4AF37;
  --gold-light: #e8cc7a;
  --gold-dark: #8a6a1f;
  --text-muted: #b8b8b8;
  --text-secondary: #e8e8e8;
  --border: rgba(212, 175, 55, 0.15);
  --border-light: rgba(212, 175, 55, 0.08);
  --transition-smooth: all 300ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-quick: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
}

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  font-size: 16px;
}

body {
  background: var(--black);
  color: var(--white);
  font-family: 'Outfit', sans-serif;
  font-weight: 300;
  overflow-x: hidden;
  line-height: 1.6;
}

::-webkit-scrollbar {
  width: 6px;
}

::-webkit-scrollbar-track {
  background: var(--black);
}

::-webkit-scrollbar-thumb {
  background: var(--gold);
  border-radius: 3px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--gold-light);
}

/* Navigation */
nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 4rem;
  background: rgba(11, 11, 11, 0.95);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border-light);
  transition: var(--transition-smooth);
}

nav.scrolled {
  padding: 0.7rem 4rem;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
}

.nav-logo img {
  height: 48px;
  width: auto;
  display: block;
  object-fit: contain;
  transition: var(--transition-quick);
}

.nav-logo:hover img,
.nav-logo:focus img {
  opacity: 0.9;
}

.nav-logo:focus {
  outline: 2px solid var(--gold);
  outline-offset: 4px;
  border-radius: 2px;
}

.nav-links {
  display: flex;
  gap: 2.5rem;
  list-style: none;
}

.nav-links a {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 0.8rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  transition: var(--transition-quick);
  position: relative;
  padding-bottom: 2px;
  font-weight: 400;
}

.nav-links a::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: var(--gold);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 300ms cubic-bezier(0.4, 0, 0.2, 1);
}

.nav-links a:hover,
.nav-links a:focus,
.nav-links a.active {
  color: var(--gold);
  outline: none;
}

.nav-links a:hover::after,
.nav-links a:focus::after,
.nav-links a.active::after {
  transform: scaleX(1);
}

.nav-links a:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 6px;
}

.nav-cta {
  background: transparent;
  border: 1.5px solid var(--gold);
  color: var(--gold);
  padding: 0.55rem 1.4rem;
  font-family: 'Outfit', sans-serif;
  font-size: 0.78rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  transition: var(--transition-quick);
  cursor: pointer;
  font-weight: 500;
  border-radius: 2px;
}

.nav-cta:hover,
.nav-cta:focus {
  background: var(--gold);
  color: var(--black);
  box-shadow: 0 8px 24px rgba(212, 175, 55, 0.4);
}

.nav-cta:active {
  transform: scale(0.98);
  box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
}

.nav-cta:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 4px;
}

.nav-toggle {
  display: none;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  padding: 4px;
  background: transparent;
  border: none;
}

.nav-toggle:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 4px;
  border-radius: 2px;
}

.nav-toggle span {
  display: block;
  width: 24px;
  height: 1.5px;
  background: var(--gold);
  transition: var(--transition-quick);
}

.mobile-menu {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(11, 11, 11, 0.98);
  z-index: 190;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2.5rem;
  overflow-y: auto;
}

.mobile-menu.open {
  display: flex;
}

.mobile-menu a {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.5rem;
  font-weight: 300;
  color: var(--text-muted);
  text-decoration: none;
  transition: var(--transition-quick);
}

.mobile-menu a:hover,
.mobile-menu a:focus {
  color: var(--gold);
  outline: none;
}

.mobile-menu a:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 8px;
}

.mobile-close {
  position: absolute;
  top: 1.5rem;
  right: 1.5rem;
  font-size: 1.5rem;
  color: var(--gold);
  cursor: pointer;
  background: none;
  border: none;
  padding: 8px;
  transition: var(--transition-quick);
  border-radius: 2px;
}

.mobile-close:hover,
.mobile-close:focus {
  transform: scale(1.1);
  background: rgba(212, 175, 55, 0.1);
}

.mobile-close:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 4px;
}

/* Hero Section */
.hero {
  min-height: 100vh;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  margin-top: 60px;
}

.hero-banner-bg {
  position: absolute;
  inset: 0;
  background-image: url('banner.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  filter: brightness(0.25);
}

.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(11, 11, 11, 0.6) 0%, rgba(11, 11, 11, 0.4) 40%, rgba(11, 11, 11, 0.9) 100%);
}

.hero-grid {
  position: absolute;
  inset: 0;
  opacity: 0.015;
  background-image: linear-gradient(var(--gold) 1px, transparent 1px), linear-gradient(90deg, var(--gold) 1px, transparent 1px);
  background-size: 60px 60px;
}

.hero-inner {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: 1fr 400px;
  gap: 3rem;
  align-items: center;
  padding: 10rem 4rem 6rem;
  max-width: 1300px;
  margin: 0 auto;
  width: 100%;
}

.hero-label {
  font-size: 0.68rem;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 1.8rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  animation: fadeUp 1s ease 0.2s both;
  font-weight: 500;
}

.hero-label::before,
.hero-label::after {
  content: '';
  display: block;
  width: 40px;
  height: 1px;
  background: var(--gold);
}

.hero h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(3rem, 6vw, 6rem);
  font-weight: 300;
  line-height: 1.05;
  color: var(--gold);
  margin-bottom: 0.5rem;
  animation: fadeUp 1s ease 0.35s both;
  letter-spacing: -0.01em;
}

.hero h1 em {
  font-style: italic;
  color: var(--gold);
  display: block;
}

.hero-sub {
  font-size: 0.85rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 1.8rem;
  animation: fadeUp 1s ease 0.5s both;
  font-weight: 400;
}

.hero-desc {
  font-size: 0.97rem;
  line-height: 1.85;
  color: var(--white);
  margin-bottom: 2.5rem;
  max-width: 540px;
  animation: fadeUp 1s ease 0.65s both;
  font-weight: 300;
}

.hero-actions {
  display: flex;
  gap: 1.2rem;
  flex-wrap: wrap;
  animation: fadeUp 1s ease 0.8s both;
}

/* Button Styles */
.btn-gold,
.btn-outline {
  padding: 1rem 2.5rem;
  text-decoration: none;
  font-size: 0.78rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-family: 'Outfit', sans-serif;
  font-weight: 500;
  border-radius: 2px;
  cursor: pointer;
  transition: var(--transition-smooth);
  display: inline-block;
  border: none;
  position: relative;
  overflow: hidden;
}

.btn-gold {
  background: var(--gold);
  color: var(--black);
  box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
}

.btn-gold:hover,
.btn-gold:focus {
  background: var(--gold-light);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(212, 175, 55, 0.4);
  outline: none;
}

.btn-gold:active {
  transform: translateY(0);
  box-shadow: 0 2px 8px rgba(212, 175, 55, 0.25);
}

.btn-gold:focus-visible {
  outline: 2px solid var(--black);
  outline-offset: 2px;
}

.btn-outline {
  background: transparent;
  border: 1.5px solid var(--gold);
  color: var(--white);
  transition: var(--transition-smooth);
}

.btn-outline:hover,
.btn-outline:focus {
  border-color: var(--gold);
  color: var(--gold);
  background: rgba(212, 175, 55, 0.1);
  outline: none;
}

.btn-outline:active {
  background: rgba(212, 175, 55, 0.15);
  transform: scale(0.98);
}

.btn-outline:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 4px;
}

/* Hero Profile Card */
.hero-profile-card {
  background: rgba(11, 11, 11, 0.9);
  border: 1px solid var(--border);
  backdrop-filter: blur(10px);
  overflow: hidden;
  animation: fadeUp 1s ease 0.6s both;
  position: relative;
  border-radius: 3px;
}

.hero-profile-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--gold-dark), var(--gold), var(--gold-dark));
  z-index: 1;
}

.profile-img-wrap {
  position: relative;
  overflow: hidden;
  height: 360px;
  background: var(--black);
}

.profile-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
  display: block;
  transition: transform 600ms cubic-bezier(0.4, 0, 0.2, 1);
  max-height: 360px;
}

.hero-profile-card:hover .profile-img-wrap img,
.hero-profile-card:focus-within .profile-img-wrap img {
  transform: scale(1.05);
}

.profile-card-info {
  padding: 1.4rem 1.8rem;
  border-top: 1px solid var(--border-light);
  position: relative;
  z-index: 2;
}

.profile-card-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--white);
  margin-bottom: 0.2rem;
  letter-spacing: -0.01em;
}

.profile-card-title {
  font-size: 0.68rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 500;
}

/* Marquee Band */
.marquee-band {
  border-top: 1px solid var(--border-light);
  border-bottom: 1px solid var(--border-light);
  padding: 1rem 0;
  overflow: hidden;
  background: var(--black);
}

.marquee-track {
  display: flex;
  gap: 3rem;
  white-space: nowrap;
  animation: marquee 22s linear infinite;
}

.marquee-item {
  display: flex;
  align-items: center;
  gap: 1rem;
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-muted);
  flex-shrink: 0;
  font-weight: 400;
}

.marquee-dot {
  color: var(--gold);
  font-size: 0.4rem;
}

@keyframes marquee {
  from {
    transform: translateX(0);
  }
  to {
    transform: translateX(-50%);
  }
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Services Section */
.services-section {
  padding: 8rem 4rem;
  background: var(--black);
}

.section-tag {
  font-size: 0.68rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 1rem;
  font-weight: 500;
}

.section-header-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1.5rem;
  margin-bottom: 3rem;
}

.section-header-row h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2rem, 4vw, 3.2rem);
  font-weight: 300;
  color: var(--white);
  line-height: 1.2;
  letter-spacing: -0.01em;
}

.section-header-row h2 em {
  font-style: italic;
  color: var(--gold);
}

.view-all {
  color: var(--gold);
  text-decoration: none;
  font-size: 0.75rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  transition: var(--transition-quick);
  white-space: nowrap;
  font-weight: 500;
}

.view-all:hover,
.view-all:focus {
  gap: 0.9rem;
  outline: none;
}

.view-all::after {
  content: '→';
}

.view-all:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 4px;
}

.services-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
}

.service-card {
  background: var(--black);
  padding: 2.5rem;
  position: relative;
  overflow: hidden;
  transition: var(--transition-smooth);
  text-decoration: none;
  display: block;
  border: none;
  cursor: pointer;
}

.service-card::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--gold);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 400ms cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 1;
}

.service-card:hover,
.service-card:focus {
  background: rgba(212, 175, 55, 0.05);
  outline: none;
}

.service-card:hover::after,
.service-card:focus::after {
  transform: scaleX(1);
}

.service-card:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: -2px;
}

.service-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 3.5rem;
  font-weight: 300;
  color: rgba(212, 175, 55, 0.12);
  line-height: 1;
  margin-bottom: 1.2rem;
  transition: var(--transition-smooth);
  letter-spacing: -0.02em;
}

.service-card:hover .service-num,
.service-card:focus .service-num {
  color: rgba(212, 175, 55, 0.25);
}

.service-card h3 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.45rem;
  font-weight: 600;
  color: var(--white);
  margin-bottom: 0.8rem;
  line-height: 1.3;
  letter-spacing: -0.01em;
}

.service-card p {
  font-size: 0.84rem;
  line-height: 1.75;
  color: var(--text-muted);
  margin-bottom: 1.5rem;
  font-weight: 300;
}

.service-arrow {
  color: var(--gold);
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  font-weight: 500;
}

/* Divider */
.divider {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  padding: 0 4rem;
}

.divider-line {
  flex: 1;
  height: 1px;
  background: var(--border-light);
}

.divider-diamond {
  color: var(--gold);
  font-size: 0.7rem;
}

/* About Section */
.about-strip {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-top: 1px solid var(--border-light);
  border-bottom: 1px solid var(--border-light);
  background: var(--black);
}

.about-visual {
  background: var(--black);
  position: relative;
  overflow: hidden;
  min-height: 500px;
}

.about-visual img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  position: absolute;
  inset: 0;
  filter: brightness(0.7);
  transition: filter 500ms cubic-bezier(0.4, 0, 0.2, 1);
}

.about-strip:hover .about-visual img {
  filter: brightness(0.8);
}

.about-visual-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(11, 11, 11, 0.7) 0%, transparent 60%);
  z-index: 1;
}

.about-content {
  padding: 5rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  z-index: 2;
}

.about-content h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2rem, 3.5vw, 3rem);
  font-weight: 300;
  color: var(--white);
  margin-bottom: 2rem;
  line-height: 1.2;
  letter-spacing: -0.01em;
}

.about-content h2 em {
  font-style: italic;
  color: var(--gold);
}

.about-content p {
  font-size: 0.92rem;
  line-height: 1.9;
  color: var(--white);
  margin-bottom: 1.2rem;
  font-weight: 300;
}

.about-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem;
  margin: 2rem 0;
  padding: 1.5rem 0;
  border-top: 1px solid var(--border-light);
  border-bottom: 1px solid var(--border-light);
}

.about-stat-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.2rem;
  font-weight: 300;
  color: var(--gold);
  letter-spacing: -0.02em;
}

.about-stat-label {
  font-size: 0.68rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-top: 0.5rem;
  font-weight: 500;
}

/* Testimonials Section */
.testimonials-section {
  padding: 8rem 4rem;
  background: var(--black);
  border-top: 1px solid var(--border-light);
}

.testimonials-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
}

.t-card {
  background: rgba(11, 11, 11, 0.95);
  padding: 2.5rem;
  position: relative;
  transition: var(--transition-smooth);
}

.t-card:hover {
  background: rgba(212, 175, 55, 0.05);
}

.t-card::before {
  content: '"';
  font-family: 'Cormorant Garamond', serif;
  font-size: 6rem;
  line-height: 0.8;
  color: rgba(212, 175, 55, 0.1);
  position: absolute;
  top: 1.5rem;
  right: 2rem;
  z-index: 0;
}

.stars {
  color: var(--gold);
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  margin-bottom: 1.2rem;
  font-weight: 500;
}

.t-card p {
  font-size: 0.88rem;
  line-height: 1.85;
  color: var(--white);
  font-style: italic;
  margin-bottom: 1.8rem;
  font-weight: 300;
  position: relative;
  z-index: 1;
}

.t-author {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  position: relative;
  z-index: 1;
}

.t-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold-dark), var(--gold));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--black);
  flex-shrink: 0;
}

.t-name {
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--white);
}

.t-role {
  font-size: 0.7rem;
  color: var(--text-muted);
  margin-top: 2px;
}

/* CTA Section */
.cta-section {
  padding: 9rem 4rem;
  text-align: center;
  position: relative;
  overflow: hidden;
  background: var(--black);
}

.cta-section::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 60% 80% at 50% 50%, rgba(212, 175, 55, 0.07) 0%, transparent 70%);
  pointer-events: none;
}

.cta-section h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2.5rem, 6vw, 5rem);
  font-weight: 300;
  color: var(--white);
  margin-bottom: 1.5rem;
  position: relative;
  z-index: 1;
  line-height: 1.1;
  letter-spacing: -0.01em;
}

.cta-section h2 em {
  font-style: italic;
  color: var(--gold);
}

.cta-section p {
  color: var(--white);
  font-size: 1rem;
  max-width: 520px;
  margin: 0 auto 3rem;
