<!DOCTYPE html>
<html>
<head>
  <title>EliteFit - Transform Your Body</title>
  <style>
    body { font-family: Arial; margin: 0; background: #000; color: #fff; text-align: center; }
    .hero { padding: 80px 20px; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?q=80&w=2070'); background-size: cover; }
    h1 { font-size: 50px; color: #00ff88; }
    .btn { padding: 15px 30px; background: #00ff88; color: #000; text-decoration: none; border-radius: 5px; font-weight: bold; }
    .section { padding: 60px 20px; }
  </style>
</head>
<body>

  <div class="hero">
    <h1>TRANSFORM YOUR BODY IN 90 DAYS</h1>
    <p>Online + In-Person Coaching with Coach Tunde</p>
    <a href="#contact" class="btn">Book Free Consultation</a>
  </div>

  <div class="section">
    <h2>What You Get</h2>
    <p>✅ Custom Workout Plans  ✅ Nutrition Guide  ✅ 24/7 WhatsApp Support</p>
  </div>

  <div class="section" id="contact">
    <h2>Book Your Free Call</h2>
    <form action="https://formspree.io/f/xbdvwjgg" method="POST" style="max-width: 400px; margin: auto;">
      <input type="text" name="name" placeholder="Your Name" required style="width: 100%; padding: 10px; margin: 10px 0;">
      <input type="email" name="email" placeholder="Your Email" required style="width: 100%; padding: 10px; margin: 10px 0;">
      <button type="submit" class="btn" style="border: none; width: 100%;">Get My Free Plan</button>
    </form>
  </div>

</body>
</html>
